name: Compilar APK Android (Flutter)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Baixar dependencias
        run: flutter pub get

      - name: Analisar codigo Dart
        run: flutter analyze

      - name: Executar testes unitarios
        run: flutter test

      - name: Compilar APK de producao
        run: flutter build apk --release

      - name: Publicar APK como artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: sparring-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30